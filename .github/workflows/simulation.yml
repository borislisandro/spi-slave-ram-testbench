name: Simulation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install simulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y covered iverilog verilator

      - name: Run simulation, lint, and coverage
        run: make check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/coverage/coverage.txt
            build/coverage/coverage.cdd
          if-no-files-found: ignore
